<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COGNIA Build an OS — learn operating-system development</title>
    <meta name="description" content="Learn to build an operating system, top to bottom, with animated concepts and lessons drawn from the OSDev Wiki. A COGNIA learning platform." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23000'/%3E%3Cpath d='M30 6H8v28h22' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='21' cy='20' r='3.6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try { var t = JSON.parse(localStorage.getItem('cognia-osb-theme') || 'null'); if (t === 'light') { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light'); } } catch (e) {}
    </script>
    <style>
      /* Boot screen: painted before any JS loads, matching the intro loader's first frame (src/components/intro).
         The intro removes it as it mounts; it never shows under automation, and is plain under reduced motion. */
      #intro-boot { position: fixed; inset: 0; z-index: 2147483001; background: #000; color: #ececea; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
      #intro-boot .b-log { position: absolute; left: clamp(16px, 3vw, 40px); bottom: clamp(26px, 5vh, 48px); font-size: 12px; line-height: 1.85; }
      #intro-boot .b-cur { display: inline-block; width: .62em; height: 1.1em; vertical-align: -.2em; background: #ececea; animation: b-blink 1.05s steps(1, end) infinite; }
      #intro-boot .b-pct { position: absolute; right: clamp(16px, 3vw, 40px); bottom: clamp(26px, 5vh, 48px); display: grid; grid-template-columns: auto auto; justify-items: end; align-items: start; line-height: 1; }
      #intro-boot .b-lbl { grid-column: 1 / -1; margin-bottom: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6e6e6e; }
      #intro-boot .b-num { font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
      #intro-boot .b-unit { margin: 3px 0 0 5px; font-size: 13px; color: #8c8c8a; }
      #intro-boot .b-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgba(255, 255, 255, .1); }
      #intro-boot.calm > * { display: none; }
      html.light #intro-boot.calm { background: #fff; }
      @keyframes b-blink { 50% { opacity: 0; } }
      @media (max-width: 639px) {
        #intro-boot .b-log { font-size: 10.5px; }
        #intro-boot .b-pct { top: clamp(14px, 2.6vw, 30px); bottom: auto; right: auto; left: 16px; justify-items: start; }
        #intro-boot .b-lbl { margin-bottom: 7px; font-size: 10px; }
        #intro-boot .b-num { font-size: 26px; }
      }
      @media (prefers-reduced-motion: reduce) { #intro-boot .b-cur { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- the COGNIA loader: a flight through 90,000 real galaxies (SDSS) while the site loads; the app finishes it -->
    <script>if (navigator.webdriver && !/[?&]intro\b/.test(location.search + location.hash)) document.documentElement.dataset.noLoader = ''</script>
    <script src="./cognia/cognia-loader.js" data-cognia-auto data-manual data-id="intro-boot" data-product="Build an OS" data-base="./cognia/"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
